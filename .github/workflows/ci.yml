name: CI/CD — Supabase + API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      audit_preview_credentials:
        description: "Read-only audit of Preview credential isolation"
        required: false
        type: boolean
        default: false
      confirm_preview_build:
        description: "Build a fresh Preview APK with the latest embedded JS bundle"
        required: false
        type: boolean
        default: false
      confirm_production_recovery:
        description: "Re-run every Production deployment gate for the latest main commit"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"
  # React Native 0.83.6 default from node_modules/react-native/gradle/libs.versions.toml.
  ANDROID_NDK_VERSION: "27.1.12297006"
  SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'iosdoheblabfimkjnvfj' || 'xwblovggtvbpiusjfokq' }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ── Manual Preview Credential Audit ─────────────────────────────────────
  audit-preview-credentials:
    name: Audit Preview Credential Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_preview_credentials == true }}
    steps:
      - name: Require Preview credential audit inputs
        env:
          VERCEL_PREVIEW_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          for name in \
            VERCEL_PREVIEW_DEPLOY_HOOK_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured for the Preview credential audit."
              exit 1
            fi
          done

      - name: Reject broad Supabase account credentials in Preview
        id: supabase-isolation-audit
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must not be configured in Preview. The project-bound Supabase GitHub Integration owns develop deployments."
            exit 1
          fi

      - name: Reject broad Cloudflare account credentials in Preview
        id: cloudflare-isolation-audit
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$CLOUDFLARE_API_TOKEN" || -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::A broad Cloudflare account credential must not be configured in the Preview environment."
            exit 1
          fi

      - name: Require Preview-only Vercel deploy hook
        id: vercel-isolation-audit
        continue-on-error: true
        env:
          VERCEL_PREVIEW_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$VERCEL_PREVIEW_DEPLOY_HOOK_URL" =~ ^https://api\.vercel\.com/v1/integrations/deploy/prj_w8Jh6jcev9yQxWGeYvHMbEoRrro3/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::The Preview Vercel credential must be the develop Deploy Hook for the Admin project."
            exit 1
          fi

      - name: Require every Preview credential boundary
        if: ${{ always() }}
        env:
          SUPABASE_AUDIT: ${{ steps.supabase-isolation-audit.outcome }}
          CLOUDFLARE_AUDIT: ${{ steps.cloudflare-isolation-audit.outcome }}
          VERCEL_AUDIT: ${{ steps.vercel-isolation-audit.outcome }}
        run: |
          if [[ "$SUPABASE_AUDIT" != "success" || "$CLOUDFLARE_AUDIT" != "success" || "$VERCEL_AUDIT" != "success" ]]; then
            echo "::error::Preview credential isolation failed (Supabase=$SUPABASE_AUDIT, Cloudflare=$CLOUDFLARE_AUDIT, Vercel=$VERCEL_AUDIT)."
            exit 1
          fi

  # ── Manual Preview APK Recovery ──────────────────────────────────────────
  preview-apk-recovery:
    name: Build fresh Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: preview
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.confirm_preview_build == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the latest develop commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          develop_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$develop_sha" ]]; then
            echo "::error::Recovery build SHA $GITHUB_SHA is not latest develop $develop_sha."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Set up EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.1.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required Android NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -x "$ndk_path/ndk-build"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
      - name: Build exact-SHA Preview APK
        id: mobile-build
        working-directory: ./apps/mobile
        env:
          FORCE_PREVIEW_APK: "true"
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-deploy-android.sh
      - name: Require a local Preview APK result
        env:
          DEPLOY_MODE: ${{ steps.mobile-build.outputs.mode }}
          APK_PATH: ${{ steps.mobile-build.outputs.apk-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_MODE" != "build" || ! -s "$APK_PATH" ]]; then
            echo "::error::Preview recovery did not produce a local APK."
            exit 1
          fi
          develop_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$develop_sha" ]]; then
            echo "::error::Develop moved to $develop_sha while recovery built $GITHUB_SHA."
            exit 1
          fi
      - name: Upload fresh Preview APK
        id: upload-apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.mobile-build.outputs.artifact-name }}-recovery-${{ github.sha }}
          path: ${{ steps.mobile-build.outputs.apk-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Report recovery artifact
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
          APK_SHA256: ${{ steps.mobile-build.outputs.apk-sha256 }}
          FINGERPRINT: ${{ steps.mobile-build.outputs.fingerprint }}
        run: |
          {
            echo "## Preview APK recovery"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Fingerprint: \`$FINGERPRINT\`"
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Artifact: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Change Plan & Lightweight Policy ─────────────────────────────────────
  change-plan:
    name: Change Plan & Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      ci: ${{ steps.plan.outputs.ci }}
      quality: ${{ steps.plan.outputs.quality }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      api: ${{ steps.plan.outputs.api }}
      edge_tests: ${{ steps.plan.outputs.edge_tests }}
      local_supabase: ${{ steps.plan.outputs.local_supabase }}
      worker_tests: ${{ steps.plan.outputs.worker_tests }}
      dependency_review: ${{ steps.plan.outputs.dependency_review }}
      supabase: ${{ steps.plan.outputs.supabase }}
      database: ${{ steps.plan.outputs.database }}
      functions: ${{ steps.plan.outputs.functions }}
      worker: ${{ steps.plan.outputs.worker }}
      admin: ${{ steps.plan.outputs.admin }}
      mobile: ${{ steps.plan.outputs.mobile }}
      workspace_filters: ${{ steps.plan.outputs.workspace_filters }}
      workspace_test_filters: ${{ steps.plan.outputs.workspace_test_filters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI change and release policy
        run: >-
          node --test
          scripts/ci-change-plan.test.mjs
          scripts/opening-reminder-contract.test.mjs
          scripts/preview-release-contract.test.mjs
      - name: Classify changed files
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_RECOVERY_REQUESTED: ${{ inputs.confirm_production_recovery == true && 'true' || 'false' }}
          PRODUCTION_RECOVERY_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_recovery == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          recovery_args=()

          if [[ "$PRODUCTION_RECOVERY_REQUESTED" == "true" ]]; then
            if [[ "$PRODUCTION_RECOVERY_ALLOWED" != "true" ]]; then
              echo "::error::Production recovery requires an explicit dispatch of the latest main branch."
              exit 1
            fi
            recovery_args+=(--production-recovery)
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head="$HEAD_SHA"
            base="$(git merge-base "$BASE_SHA" "$head")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse "$head^" 2>/dev/null || true)"
            fi
          else
            base=""
            head="$HEAD_SHA"
            printf '%s\n' 'scripts/ci-change-plan.mjs' > "$changed_files"
          fi

          if [[ -n "$base" && -n "$head" ]]; then
            git diff --no-renames --name-only "$base" "$head" > "$changed_files"
          fi
          node scripts/ci-change-plan.mjs \
            --files "$changed_files" \
            --github-output "$GITHUB_OUTPUT" \
            "${recovery_args[@]}"
      - name: Test mobile deployment decision logic
        if: ${{ steps.plan.outputs.mobile == 'true' || steps.plan.outputs.ci == 'true' }}
        run: bash apps/mobile/scripts/ci-deploy-android.test.sh

  # ── Lint & Typecheck ──────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.quality == 'true' }}
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
        if: ${{ needs.change-plan.outputs.api == 'true' }}
      - name: Lint affected workspaces
        env:
          WORKSPACE_FILTERS: ${{ needs.change-plan.outputs.workspace_filters }}
        run: |
          set -euo pipefail
          read -r -a workspace_filters <<< "$WORKSPACE_FILTERS"
          npm run lint -- "${workspace_filters[@]}"
      - name: Typecheck affected workspaces
        env:
          WORKSPACE_FILTERS: ${{ needs.change-plan.outputs.workspace_filters }}
        run: |
          set -euo pipefail
          read -r -a workspace_filters <<< "$WORKSPACE_FILTERS"
          npm run typecheck -- "${workspace_filters[@]}"

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.build == 'true' }}
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
        if: ${{ needs.change-plan.outputs.api == 'true' }}
      - name: Build affected workspaces
        env:
          WORKSPACE_FILTERS: ${{ needs.change-plan.outputs.workspace_filters }}
        run: |
          set -euo pipefail
          read -r -a workspace_filters <<< "$WORKSPACE_FILTERS"
          npm run build -- "${workspace_filters[@]}"

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.test == 'true' }}
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Test affected non-API workspaces
        env:
          WORKSPACE_FILTERS: ${{ needs.change-plan.outputs.workspace_test_filters }}
        run: |
          set -euo pipefail
          read -r -a workspace_filters <<< "$WORKSPACE_FILTERS"
          npm test -- "${workspace_filters[@]}"

  # ── API Tests (PostgreSQL) ────────────────────────────────────────────────
  api-tests:
    name: API Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.api == 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gonggu_wish_test
          POSTGRES_USER: gonggu
          POSTGRES_PASSWORD: gonggu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonggu -d gonggu_wish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - run: npm test -- --filter=@gonggu/api
        env:
          DATABASE_URL: postgresql://gonggu:gonggu@localhost:5432/gonggu_wish_test?schema=public
          JWT_SECRET: test-secret
          ADMIN_TOKEN: test-admin-token
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH || 'test-hash' }}

  # ── Edge Function Tests ──────────────────────────────────────────────────
  edge-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.edge_tests == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Bundle-check every Edge Function entrypoint
        run: |
          set -euo pipefail
          for entrypoint in supabase/functions/*/index.ts; do
            deno check "$entrypoint"
          done
      - run: deno test --allow-net supabase/functions

  # ── Local Supabase Contracts ─────────────────────────────────────────────
  local-supabase-contracts:
    name: Local Supabase Contracts
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.local_supabase == 'true' }}
    uses: ./.github/workflows/supabase-integration.yml

  # ── Supabase Preview Integration ────────────────────────────────────────
  supabase-preview:
    name: Supabase Preview Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [change-plan, edge-tests, local-supabase-contracts]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.change-plan.outputs.supabase == 'true' && needs.local-supabase-contracts.result == 'success' && (needs.change-plan.outputs.edge_tests != 'true' || needs.edge-tests.result == 'success') }}
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require exact Preview project deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DETAILS_URL: https://supabase.com/dashboard/project/xwblovggtvbpiusjfokq
        run: |
          set -euo pipefail
          response="$(mktemp)"
          check="$(mktemp)"
          trap 'rm -f "$response" "$check"' EXIT

          for attempt in {1..40}; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest" > "$response"
            jq --arg sha "$GITHUB_SHA" '
              [
                .check_runs[] |
                select(
                  .head_sha == $sha and
                  .app.slug == "supabase" and
                  .name == "Supabase Preview"
                )
              ] |
              sort_by(.started_at) |
              last // empty
            ' "$response" > "$check"

            if [[ -s "$check" ]]; then
              details_url="$(jq -r '.details_url // ""' "$check")"
              if [[ "$details_url" != "$EXPECTED_DETAILS_URL"* ]]; then
                echo "::error::Supabase Preview reported an unexpected project URL: $details_url"
                exit 1
              fi
              if jq -e '.status == "completed" and .conclusion == "success"' "$check" > /dev/null; then
                exit 0
              fi
              if jq -e '.status == "completed"' "$check" > /dev/null; then
                conclusion="$(jq -r '.conclusion // "missing"' "$check")"
                echo "::error::Supabase Preview deployment for $GITHUB_SHA concluded with $conclusion."
                exit 1
              fi
            fi

            if [[ "$attempt" == "40" ]]; then
              echo "::error::Supabase Preview did not complete for exact SHA $GITHUB_SHA."
              exit 1
            fi
            sleep 15
          done

  # ── Dependency Review ────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: [change-plan]
    if: ${{ github.event_name == 'pull_request' && needs.change-plan.outputs.dependency_review == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  # ── Supabase Production Integration ─────────────────────────────────────
  supabase-production:
    name: Supabase Production Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: [change-plan, edge-tests, local-supabase-contracts]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production_recovery == true)) && github.ref == 'refs/heads/main' && needs.change-plan.outputs.supabase == 'true' && needs.local-supabase-contracts.result == 'success' && (needs.change-plan.outputs.edge_tests != 'true' || needs.edge-tests.result == 'success') }}
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require latest main recovery commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Production recovery SHA $GITHUB_SHA is not latest main $main_sha."
            exit 1
          fi
      - name: Require exact Production project deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DETAILS_URL: https://supabase.com/dashboard/project/iosdoheblabfimkjnvfj
        run: |
          set -euo pipefail
          response="$(mktemp)"
          check="$(mktemp)"
          trap 'rm -f "$response" "$check"' EXIT

          # Supabase currently uses the provider-owned check name
          # "Supabase Preview" for linked Production projects as well. The
          # details URL is therefore the project identity boundary.
          for attempt in {1..40}; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest" > "$response"
            jq --arg sha "$GITHUB_SHA" '
              [
                .check_runs[] |
                select(
                  .head_sha == $sha and
                  .app.slug == "supabase" and
                  .name == "Supabase Preview"
                )
              ] |
              sort_by(.started_at) |
              last // empty
            ' "$response" > "$check"

            if [[ -s "$check" ]]; then
              details_url="$(jq -r '.details_url // ""' "$check")"
              if [[ "$details_url" != "$EXPECTED_DETAILS_URL"* ]]; then
                echo "::error::Supabase Production reported an unexpected project URL: $details_url"
                exit 1
              fi
              if jq -e '.status == "completed" and .conclusion == "success"' "$check" > /dev/null; then
                exit 0
              fi
              if jq -e '.status == "completed"' "$check" > /dev/null; then
                conclusion="$(jq -r '.conclusion // "missing"' "$check")"
                echo "::error::Supabase Production deployment for $GITHUB_SHA concluded with $conclusion."
                exit 1
              fi
            fi

            if [[ "$attempt" == "40" ]]; then
              echo "::error::Supabase Production did not complete for exact SHA $GITHUB_SHA."
              exit 1
            fi
            sleep 15
          done

  # ── Cloudflare Worker Checks ─────────────────────────────────────────────
  worker-tests:
    name: Cloudflare Worker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [change-plan]
    if: ${{ needs.change-plan.outputs.worker_tests == 'true' }}
    defaults:
      run:
        working-directory: ./workers/api-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: workers/api-proxy/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:preview

  # ── Cloudflare Worker Deploy ─────────────────────────────────────────────
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    needs: [change-plan, worker-tests, supabase-preview, supabase-production]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production_recovery == true)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.change-plan.outputs.worker == 'true' && needs.worker-tests.result == 'success' && ((github.ref == 'refs/heads/main' && (needs.change-plan.outputs.supabase != 'true' || needs.supabase-production.result == 'success')) || (github.ref == 'refs/heads/develop' && (needs.change-plan.outputs.supabase != 'true' || needs.supabase-preview.result == 'success'))) }}
    defaults:
      run:
        working-directory: ./workers/api-proxy
    steps:
      - name: Require latest main recovery commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Production recovery SHA $GITHUB_SHA is not latest main $main_sha."
            exit 1
          fi
      - name: Check Cloudflare credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            if [[ -n "$CLOUDFLARE_API_TOKEN" || -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
              echo "::error::A broad Cloudflare account credential must not be configured in the Preview environment."
              exit 1
            fi
          else
            if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
              echo "::error::Production Cloudflare Worker credentials are not configured."
              exit 1
            fi
          fi
      - name: Verify Production Cloudflare target
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          workers="$(mktemp)"
          trap 'rm -f "$workers"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$workers" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          if ! jq -e '.result[] | select(.id == "gonggu-api-proxy")' "$workers" > /dev/null; then
            echo "::error::The Production Cloudflare credential cannot access gonggu-api-proxy."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          node-version: "22"
      - name: Install Worker dependencies
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm ci
      - name: Deploy Production Worker
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run deploy:production -- --tag "$GITHUB_SHA" --message "GitHub $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Require exact Preview Worker deployment
        if: ${{ github.ref == 'refs/heads/develop' }}
        working-directory: .
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          for attempt in {1..40}; do
            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              https://api-preview.gongguwish.com/health)"
            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA" '
              .status == "ok" and
              .environment == "preview" and
              .commitSha == $sha and
              .supabaseProjectRef == "xwblovggtvbpiusjfokq"
            ' "$response" > /dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "40" ]]; then
              echo "::error::Preview Worker did not publish the exact SHA $GITHUB_SHA."
              exit 1
            fi
            sleep 15
          done

  # ── Expo Mobile Deploy ───────────────────────────────────────────────────
  deploy-mobile:
    name: Deploy Mobile (OTA or Local APK)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    outputs:
      mode: ${{ steps.mobile-deploy.outputs.mode }}
      environment: ${{ steps.mobile-deploy.outputs.environment }}
      fingerprint: ${{ steps.mobile-deploy.outputs.fingerprint }}
      artifact-name: ${{ steps.mobile-deploy.outputs.artifact-name }}
      apk-artifact-id: ${{ steps.upload-apk.outputs.artifact-id }}
      apk-artifact-url: ${{ steps.upload-apk.outputs.artifact-url }}
      apk-sha256: ${{ steps.mobile-deploy.outputs.apk-sha256 }}
      expo-url: ${{ steps.mobile-deploy.outputs.expo-url }}
    needs:
      [
        change-plan,
        lint,
        build,
        test,
        api-tests,
        supabase-preview,
        supabase-production,
        deploy-worker,
      ]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production_recovery == true)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.change-plan.outputs.mobile == 'true' && needs.lint.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success' && (needs.change-plan.outputs.api != 'true' || needs.api-tests.result == 'success') && ((github.ref == 'refs/heads/main' && (needs.change-plan.outputs.supabase != 'true' || needs.supabase-production.result == 'success') && (needs.change-plan.outputs.worker != 'true' || needs.deploy-worker.result == 'success')) || (github.ref == 'refs/heads/develop' && (needs.change-plan.outputs.supabase != 'true' || needs.supabase-preview.result == 'success') && (needs.change-plan.outputs.worker != 'true' || needs.deploy-worker.result == 'success'))) }}
    steps:
      - name: Require latest main recovery commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Production recovery SHA $GITHUB_SHA is not latest main $main_sha."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Set up EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.1.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required Android NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -x "$ndk_path/ndk-build"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
      - name: Run fingerprint-aware local Android deployment
        id: mobile-deploy
        working-directory: ./apps/mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-deploy-android.sh
      - name: Upload local APK artifact
        id: upload-apk
        if: ${{ always() && steps.mobile-deploy.outputs.mode == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.mobile-deploy.outputs.artifact-name }}
          path: ${{ steps.mobile-deploy.outputs.apk-path }}
          if-no-files-found: error
          compression-level: 0
      - name: Report local APK artifact
        if: steps.mobile-deploy.outputs.mode == 'build'
        env:
          GITHUB_ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
          EXPO_DOWNLOAD_URL: ${{ steps.mobile-deploy.outputs.expo-url }}
        run: |
          {
            echo ""
            echo "### Download links"
            echo "- GitHub Actions artifact: $GITHUB_ARTIFACT_URL"
            if [[ -n "$EXPO_DOWNLOAD_URL" ]]; then
              echo "- Expo download: $EXPO_DOWNLOAD_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Preview Release Gate ─────────────────────────────────────────────────
  preview-release-gate:
    name: Preview Green
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      [
        change-plan,
        lint,
        build,
        test,
        api-tests,
        edge-tests,
        local-supabase-contracts,
        supabase-preview,
        worker-tests,
        deploy-worker,
        deploy-mobile,
      ]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    environment:
      name: preview
      url: https://gong-gu-wish-admin-git-develop-jsy10835.vercel.app
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Require every affected Preview component
        env:
          PLAN_RESULT: ${{ needs.change-plan.result }}
          QUALITY_REQUIRED: ${{ needs.change-plan.outputs.quality }}
          TEST_REQUIRED: ${{ needs.change-plan.outputs.test }}
          API_REQUIRED: ${{ needs.change-plan.outputs.api }}
          EDGE_REQUIRED: ${{ needs.change-plan.outputs.edge_tests }}
          LOCAL_SUPABASE_REQUIRED: ${{ needs.change-plan.outputs.local_supabase }}
          SUPABASE_REQUIRED: ${{ needs.change-plan.outputs.supabase }}
          WORKER_REQUIRED: ${{ needs.change-plan.outputs.worker }}
          MOBILE_REQUIRED: ${{ needs.change-plan.outputs.mobile }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          API_TEST_RESULT: ${{ needs.api-tests.result }}
          EDGE_RESULT: ${{ needs.edge-tests.result }}
          LOCAL_SUPABASE_RESULT: ${{ needs.local-supabase-contracts.result }}
          SUPABASE_PREVIEW_RESULT: ${{ needs.supabase-preview.result }}
          WORKER_TEST_RESULT: ${{ needs.worker-tests.result }}
          WORKER_RESULT: ${{ needs.deploy-worker.result }}
          MOBILE_RESULT: ${{ needs.deploy-mobile.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::Change Plan & Policy result is $PLAN_RESULT, expected success."
            exit 1
          fi

          require_result() {
            local required="$1"
            local name="$2"
            shift 2
            if [[ "$required" != "true" ]]; then
              return
            fi
            for result in "$@"; do
              if [[ "$result" != "success" ]]; then
                echo "::error::$name result is $result, expected success."
                exit 1
              fi
            done
          }

          require_result "$QUALITY_REQUIRED" "Workspace quality" \
            "$LINT_RESULT" "$BUILD_RESULT"
          require_result "$TEST_REQUIRED" "Workspace tests" "$TEST_RESULT"
          require_result "$API_REQUIRED" "API tests" "$API_TEST_RESULT"
          require_result "$EDGE_REQUIRED" "Edge Function tests" "$EDGE_RESULT"
          require_result "$LOCAL_SUPABASE_REQUIRED" "Local Supabase contracts" \
            "$LOCAL_SUPABASE_RESULT"
          require_result "$SUPABASE_REQUIRED" "Supabase Preview integration" \
            "$SUPABASE_PREVIEW_RESULT"
          require_result "$WORKER_REQUIRED" "Cloudflare Worker" \
            "$WORKER_TEST_RESULT" "$WORKER_RESULT"
          require_result "$MOBILE_REQUIRED" "React Native" "$MOBILE_RESULT"

      - name: Trigger the Vercel Preview deployment for this SHA
        if: ${{ needs.change-plan.outputs.admin == 'true' }}
        env:
          VERCEL_PREVIEW_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_PREVIEW_DEPLOY_HOOK_URL" ]]; then
            echo "::error::VERCEL_PREVIEW_DEPLOY_HOOK_URL is not configured in the Preview environment."
            exit 1
          fi
          if [[ ! "$VERCEL_PREVIEW_DEPLOY_HOOK_URL" =~ ^https://api\.vercel\.com/v1/integrations/deploy/prj_w8Jh6jcev9yQxWGeYvHMbEoRrro3/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::The Preview Vercel credential must be the develop Deploy Hook for the Admin project."
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --output "$response" \
            "$VERCEL_PREVIEW_DEPLOY_HOOK_URL"
          jq -e '
            .job.id | type == "string" and length > 0
          ' "$response" > /dev/null

      - name: Require the Vercel Preview deployment for this SHA
        if: ${{ needs.change-plan.outputs.admin == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            mapfile -t deployment_ids < <(
              gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&per_page=100" |
                jq -r --arg sha "$GITHUB_SHA" '
                  [
                    .[] |
                    select(
                      .sha == $sha and
                      .ref == $sha and
                      .creator.login == "vercel[bot]" and
                      .environment == "Preview – gong-gu-wish-admin"
                    )
                  ] |
                  sort_by(.created_at) |
                  reverse |
                  .[].id
                '
            )

            deployment_url=""
            for deployment_id in "${deployment_ids[@]}"; do
              deployment_url="$(
              gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" |
                  jq -r '
                    [
                      .[] |
                      select(
                        .creator.login == "vercel[bot]" and
                        .environment == "Preview – gong-gu-wish-admin" and
                        .state == "success" and
                        ((.environment_url // "") |
                          test("^https://gong-gu-wish-admin-[a-z0-9-]+-jsy10835\\.vercel\\.app/?$"))
                      )
                    ] |
                    sort_by(.created_at) |
                    last |
                    .environment_url // empty
                  '
              )"
              if [[ -n "$deployment_url" ]]; then
                break
              fi
            done

            if [[ -n "$deployment_url" ]]; then
              echo "VERCEL_PREVIEW_URL=$deployment_url" >> "$GITHUB_ENV"
              break
            fi

            if [[ "$attempt" == "20" ]]; then
              echo "::error::No successful Vercel Preview deployment found for $GITHUB_SHA."
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test affected Preview components
        if: ${{ needs.change-plan.outputs.supabase == 'true' || needs.change-plan.outputs.worker == 'true' || needs.change-plan.outputs.admin == 'true' }}
        env:
          SUPABASE_REQUIRED: ${{ needs.change-plan.outputs.supabase }}
          WORKER_REQUIRED: ${{ needs.change-plan.outputs.worker }}
          ADMIN_REQUIRED: ${{ needs.change-plan.outputs.admin }}
          HIKER_SMOKE_URL: ${{ vars.PREVIEW_HIKER_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [[ "$SUPABASE_REQUIRED" == "true" && -z "$HIKER_SMOKE_URL" ]]; then
            echo "::error::PREVIEW_HIKER_SMOKE_URL is not configured in the Preview environment."
            exit 1
          fi

          api_response="$(mktemp)"
          stable_identity="$(mktemp)"
          immutable_identity="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$api_response" "$stable_identity" "$immutable_identity" "$response_file"' EXIT

          api_status="$(curl --silent --show-error \
            --output "$api_response" \
            --write-out '%{http_code}' \
            https://api-preview.gongguwish.com/health)"
          if [[ "$api_status" != "200" ]]; then
            echo "::error::Preview API health returned HTTP $api_status."
            exit 1
          fi
          jq -e '
            .status == "ok" and
            .environment == "preview" and
            .supabaseProjectRef == "xwblovggtvbpiusjfokq"
          ' "$api_response" > /dev/null
          if [[ "$WORKER_REQUIRED" == "true" ]]; then
            jq -e --arg sha "$GITHUB_SHA" '.commitSha == $sha' \
              "$api_response" > /dev/null
          fi

          verify_admin_identity() {
            local base_url="$1"
            local output_file="$2"
            local status
            status="$(curl --silent --show-error \
              --output "$output_file" \
              --write-out '%{http_code}' \
              "${base_url%/}/release-identity.json")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Admin release identity at $base_url returned HTTP $status."
              exit 1
            fi
            jq -e --arg sha "$GITHUB_SHA" '
              .environment == "preview" and
              .commitSha == $sha and
              .gitRef == "develop" and
              .supabaseProjectRef == "xwblovggtvbpiusjfokq" and
              .supabaseOrigin == "https://xwblovggtvbpiusjfokq.supabase.co" and
              .adminApiOrigin == "https://xwblovggtvbpiusjfokq.supabase.co/functions/v1/admin-api"
            ' "$output_file" > /dev/null
          }

          if [[ "$ADMIN_REQUIRED" == "true" ]]; then
            verify_admin_identity \
              "https://gong-gu-wish-admin-git-develop-jsy10835.vercel.app" \
              "$stable_identity"
            verify_admin_identity "$VERCEL_PREVIEW_URL" "$immutable_identity"
          fi

          if [[ "$SUPABASE_REQUIRED" == "true" ]]; then
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg url "$HIKER_SMOKE_URL" '{url: $url}')" \
              https://xwblovggtvbpiusjfokq.supabase.co/functions/v1/hiker-lookup)"

            if [[ "$status" != "200" ]]; then
              error_message="$(jq -r '.error // "unknown Hiker lookup failure"' "$response_file" 2>/dev/null || true)"
              echo "::error::Preview hiker-lookup returned HTTP $status: $error_message"
              exit 1
            fi
            jq -e '
              type == "object" and
              (has("error") | not) and
              (
                ((.imageUrl // "") != "") or
                ((.videoUrl // "") != "") or
                (((.mediaUrls // []) | length) > 0) or
                (((.mediaItems // []) | length) > 0)
              )
            ' "$response_file" > /dev/null
          fi

      - name: Create affected-components Preview release manifest
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/preview-release.json
          RUNTIME_BASELINE_MANIFEST: ${{ runner.temp }}/preview-runtime-baseline.json
          DOCS_ONLY: ${{ needs.change-plan.outputs.docs_only }}
          SUPABASE_REQUIRED: ${{ needs.change-plan.outputs.supabase }}
          WORKER_REQUIRED: ${{ needs.change-plan.outputs.worker }}
          ADMIN_REQUIRED: ${{ needs.change-plan.outputs.admin }}
          MOBILE_REQUIRED: ${{ needs.change-plan.outputs.mobile }}
          MOBILE_DEPLOY_MODE: ${{ needs.deploy-mobile.outputs.mode }}
          MOBILE_FINGERPRINT: ${{ needs.deploy-mobile.outputs.fingerprint }}
          MOBILE_ARTIFACT_NAME: ${{ needs.deploy-mobile.outputs.artifact-name }}
          MOBILE_ARTIFACT_ID: ${{ needs.deploy-mobile.outputs.apk-artifact-id }}
          MOBILE_ARTIFACT_URL: ${{ needs.deploy-mobile.outputs.apk-artifact-url }}
          MOBILE_APK_SHA256: ${{ needs.deploy-mobile.outputs.apk-sha256 }}
          MOBILE_EXPO_URL: ${{ needs.deploy-mobile.outputs.expo-url }}
        run: |
          admin_url="${VERCEL_PREVIEW_URL:-https://gong-gu-wish-admin-git-develop-jsy10835.vercel.app}"
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg status "preview-green" \
            --arg adminUrl "$admin_url" \
            --arg apiUrl "https://api-preview.gongguwish.com" \
            --arg mobileDeployMode "$MOBILE_DEPLOY_MODE" \
            --arg mobileFingerprint "$MOBILE_FINGERPRINT" \
            --arg mobileArtifactName "$MOBILE_ARTIFACT_NAME" \
            --arg mobileArtifactId "$MOBILE_ARTIFACT_ID" \
            --arg mobileArtifactUrl "$MOBILE_ARTIFACT_URL" \
            --arg mobileApkSha256 "$MOBILE_APK_SHA256" \
            --arg mobileExpoUrl "$MOBILE_EXPO_URL" \
            --argjson docsOnly "$DOCS_ONLY" \
            --argjson supabase "$SUPABASE_REQUIRED" \
            --argjson worker "$WORKER_REQUIRED" \
            --argjson admin "$ADMIN_REQUIRED" \
            --argjson mobile "$MOBILE_REQUIRED" \
            '{
              sha: $sha,
              status: $status,
              docsOnly: $docsOnly,
              affected: {
                supabase: $supabase,
                worker: $worker,
                admin: $admin,
                mobile: $mobile
              },
              mobileDeployment: (
                if $mobile then {
                  mode: $mobileDeployMode,
                  fingerprint: $mobileFingerprint,
                  artifactName: $mobileArtifactName,
                  artifactId: $mobileArtifactId,
                  artifactUrl: $mobileArtifactUrl,
                  apkSha256: $mobileApkSha256,
                  expoUrl: $mobileExpoUrl
                } else null end
              ),
              adminUrl: $adminUrl,
              apiUrl: $apiUrl
            }' \
            > "$RELEASE_MANIFEST"

          if [[ "$MOBILE_REQUIRED" == "true" && "$MOBILE_DEPLOY_MODE" == "build" ]]; then
            if [[ ! "$MOBILE_FINGERPRINT" =~ ^[A-Za-z0-9_-]{16,128}$ ]] ||
              [[ ! "$MOBILE_ARTIFACT_ID" =~ ^[0-9]+$ ]] ||
              [[ ! "$MOBILE_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Preview APK baseline metadata is invalid."
              exit 1
            fi
            if [[ "$MOBILE_ARTIFACT_NAME" != "gonggu-wish-preview-runtime-$MOBILE_FINGERPRINT" ]]; then
              echo "::error::Preview APK artifact name does not match its fingerprint."
              exit 1
            fi
            jq -n \
              --arg fingerprint "$MOBILE_FINGERPRINT" \
              --arg commitSha "${{ github.sha }}" \
              --arg workflowRunId "${{ github.run_id }}" \
              --arg apkArtifactId "$MOBILE_ARTIFACT_ID" \
              --arg apkArtifactName "$MOBILE_ARTIFACT_NAME" \
              --arg apkArtifactUrl "$MOBILE_ARTIFACT_URL" \
              --arg apkSha256 "$MOBILE_APK_SHA256" \
              '{
                schemaVersion: 1,
                environment: "preview",
                packageName: "com.gonggu.wish.preview",
                mode: "build",
                fingerprint: $fingerprint,
                commitSha: $commitSha,
                workflowRunId: $workflowRunId,
                apkArtifactId: $apkArtifactId,
                apkArtifactName: $apkArtifactName,
                apkArtifactUrl: $apkArtifactUrl,
                apkSha256: $apkSha256
              }' \
              > "$RUNTIME_BASELINE_MANIFEST"
          fi
          {
            echo "## Preview Green"
            echo ""
            printf 'All affected Preview checks passed for `%s`; unchanged components were reused.\n' "${{ github.sha }}"
            echo "Docs-only: $DOCS_ONLY; affected: Supabase=$SUPABASE_REQUIRED, Worker=$WORKER_REQUIRED, Admin=$ADMIN_REQUIRED, Mobile=$MOBILE_REQUIRED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Preview release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-${{ github.sha }}
          path: ${{ runner.temp }}/preview-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Preview runtime baseline manifest
        if: needs.change-plan.outputs.mobile == 'true' && needs.deploy-mobile.outputs.mode == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gonggu-wish-preview-runtime-${{ needs.deploy-mobile.outputs.fingerprint }}-baseline
          path: ${{ runner.temp }}/preview-runtime-baseline.json
          if-no-files-found: error

  # ── Production Promotion Gate ────────────────────────────────────────────
  promotion-gate:
    name: Preview Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the latest develop Preview-green SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" || "$HEAD_REF" != "develop" ]]; then
            echo "::error::Production promotion PRs must come from this repository's develop branch."
            exit 1
          fi

          develop_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$HEAD_SHA" != "$develop_sha" ]]; then
            echo "::error::PR head $HEAD_SHA is not the latest develop SHA $develop_sha."
            exit 1
          fi

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$BASE_SHA" != "$main_sha" ]]; then
            echo "::error::PR base $BASE_SHA is not the latest main SHA $main_sha. Update the branch first."
            exit 1
          fi

          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.status')"
          # A completed develop-to-main promotion leaves a merge commit that is
          # not in develop, so later promotions normally report "diverged".
          # Content safety is enforced by the tested merge-tree equality below.
          case "$compare_status" in
            ahead|identical|diverged) ;;
            *)
              echo "::error::main and develop have an invalid promotion relationship ($compare_status)."
              exit 1
              ;;
          esac

          head_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha')"
          merge_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MERGE_SHA" --jq '.tree.sha')"
          if [[ "$merge_tree" != "$head_tree" ]]; then
            echo "::error::The tested PR merge tree differs from the Preview-green develop tree."
            exit 1
          fi

          runs_response="$(mktemp)"
          jobs_response="$(mktemp)"
          trap 'rm -f "$runs_response" "$jobs_response"' EXIT

          for attempt in {1..40}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=develop&event=push&per_page=100" > "$runs_response"
            run_id="$(jq -r --arg sha "$HEAD_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] |
              sort_by(.created_at) |
              last |
              .id // empty
            ' "$runs_response")"

            if [[ -n "$run_id" ]]; then
              run_status="$(jq -r --argjson id "$run_id" '
                [.workflow_runs[] | select(.id == $id)] | last | .status // empty
              ' "$runs_response")"
              run_conclusion="$(jq -r --argjson id "$run_id" '
                [.workflow_runs[] | select(.id == $id)] | last | .conclusion // empty
              ' "$runs_response")"

              if [[ "$run_status" == "completed" && "$run_conclusion" != "success" ]]; then
                echo "::error::The develop workflow for $HEAD_SHA concluded with $run_conclusion before Preview Green succeeded."
                exit 1
              fi

              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$jobs_response"
              preview_status="$(jq -r '
                [.jobs[] | select(.name == "Preview Green")] |
                last |
                .status // empty
              ' "$jobs_response")"
              preview_conclusion="$(jq -r '
                [.jobs[] | select(.name == "Preview Green")] |
                last |
                .conclusion // empty
              ' "$jobs_response")"

              if [[ "$preview_status" == "completed" && "$preview_conclusion" == "success" ]]; then
                break
              fi
              if [[ "$preview_status" == "completed" ]]; then
                echo "::error::Preview Green for $HEAD_SHA concluded with $preview_conclusion."
                exit 1
              fi
              if [[ "$run_status" == "completed" && -z "$preview_status" ]]; then
                echo "::error::The successful develop workflow has no Preview Green job."
                exit 1
              fi
            fi

            if [[ "$attempt" == "40" ]]; then
              echo "::error::Preview Green did not succeed for exact develop SHA $HEAD_SHA."
              exit 1
            fi
            sleep 15
          done

          {
            echo "## Preview promotion approved"
            echo ""
            echo "Latest develop SHA `$HEAD_SHA` has a successful Preview-green release gate."
          } >> "$GITHUB_STEP_SUMMARY"
