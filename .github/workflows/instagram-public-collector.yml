name: Instagram Public Collector

on:
  workflow_dispatch:
    inputs:
      collection_mode:
        description: "수집 범위"
        required: true
        type: choice
        options:
          - both
          - watchlist
          - random
        default: both
      target_group_buys:
        description: "랜덤 발견에서 찾을 신규 공구 후보 수"
        required: true
        type: string
        default: "3"
      time_budget_seconds:
        description: "랜덤 발견 최대 실행 시간(초)"
        required: true
        type: string
        default: "900"
      confirm_production:
        description: "실제 Production DB에 저장하는 실행임을 확인합니다"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-public-collector-production
  cancel-in-progress: false

jobs:
  production-collector:
    name: Run Production Instagram collector
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - name: Require the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Collector SHA $GITHUB_SHA is not latest main $main_sha."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate collector inputs
        env:
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          TARGET_GROUP_BUYS: ${{ inputs.target_group_buys }}
          TIME_BUDGET_SECONDS: ${{ inputs.time_budget_seconds }}
        run: |
          set -euo pipefail
          case "$COLLECTION_MODE" in
            both) watchlist_enabled=true; random_enabled=true ;;
            watchlist) watchlist_enabled=true; random_enabled=false ;;
            random) watchlist_enabled=false; random_enabled=true ;;
            *) echo "::error::Unsupported collection mode."; exit 1 ;;
          esac

          if [[ ! "$TARGET_GROUP_BUYS" =~ ^[0-9]+$ ]]; then
            echo "::error::target_group_buys must be an integer."
            exit 1
          fi
          target_group_buys=$((10#$TARGET_GROUP_BUYS))
          if (( target_group_buys < 1 || target_group_buys > 20 )); then
            echo "::error::target_group_buys must be between 1 and 20."
            exit 1
          fi

          if [[ ! "$TIME_BUDGET_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "::error::time_budget_seconds must be an integer."
            exit 1
          fi
          time_budget_seconds=$((10#$TIME_BUDGET_SECONDS))
          if (( time_budget_seconds < 60 || time_budget_seconds > 1800 )); then
            echo "::error::time_budget_seconds must be between 60 and 1800."
            exit 1
          fi

          {
            echo "INSTAGRAM_PUBLIC_WATCHLIST_ENABLED=$watchlist_enabled"
            echo "INSTAGRAM_RANDOM_DISCOVERY_ENABLED=$random_enabled"
            echo "INSTAGRAM_DISCOVERY_TARGET_GROUP_BUYS=$target_group_buys"
            echo "INSTAGRAM_DISCOVERY_TIME_BUDGET_SECONDS=$time_budget_seconds"
            echo "INSTAGRAM_DISCOVERY_EMERGENCY_MAX_ACCOUNTS=0"
          } >> "$GITHUB_ENV"

      - name: Install collector dependencies
        working-directory: workers/instagram
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate required Production secrets
        env:
          INSTAGRAM_COLLECTOR_TOKEN: ${{ secrets.INSTAGRAM_COLLECTOR_TOKEN }}
          INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON: ${{ secrets.INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$INSTAGRAM_COLLECTOR_TOKEN" ]]; then
            echo "::error::Production secret INSTAGRAM_COLLECTOR_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "$INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON" ]]; then
            echo "::error::Production secret INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON is not configured."
            exit 1
          fi
          python - <<'PY'
          import json
          import os

          raw = os.environ["INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON"]
          size = len(raw.encode("utf-8"))
          if size > 48 * 1024:
              raise SystemExit("storageState secret exceeds GitHub's 48 KiB secret limit")
          # GitHub Secret Manager may preserve a UTF-8 BOM from a Windows-created JSON file.
          state = json.loads(raw.lstrip("\ufeff"))
          if not isinstance(state, dict):
              raise SystemExit("storageState secret must be a JSON object")
          print(f"storageState validated ({size} bytes)")
          PY

      - name: Run collector unit tests and compile check
        working-directory: workers/instagram
        run: |
          set -euo pipefail
          python -m unittest test_target.py test_public_main.py test_public_parser.py
          python -m compileall -q .

      - name: Collect into Production
        id: collect
        working-directory: workers/instagram
        env:
          INSTAGRAM_COLLECTOR_TOKEN: ${{ secrets.INSTAGRAM_COLLECTOR_TOKEN }}
          INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON: ${{ secrets.INSTAGRAM_PLAYWRIGHT_STORAGE_STATE_JSON }}
          INSTAGRAM_PUBLIC_CRAWLER_ENABLED: "true"
          INSTAGRAM_COLLECTION_TARGET: production
          INSTAGRAM_ALLOW_PRODUCTION_WRITES: "true"
          INSTAGRAM_PRODUCTION_PREFLIGHT_PASSED: "true"
          INSTAGRAM_PUBLIC_RUN_ONCE: "true"
          INSTAGRAM_PUBLIC_POST_LIMIT: "3"
          INSTAGRAM_PLAYWRIGHT_HEADLESS: "true"
        run: python public_main.py

      - name: Write run summary
        if: always()
        env:
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "## Instagram Production Collector"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Collection mode: `$COLLECTION_MODE`"
            echo "- Result: `$COLLECT_OUTCOME`"
            echo "- Target: Production Supabase"
            echo "- Review: Admin → 자동 수집 검수"
          } >> "$GITHUB_STEP_SUMMARY"
