version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - react-test-renderer
    # Expo SDK-managed package majors must move with a coordinated SDK upgrade.
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
      - dependency-name: babel-preset-expo
        update-types:
          - version-update:semver-major
      # 16.4.0 pulls Google Ads 25.4.0, whose Kotlin 2.3 metadata is
      # incompatible with the current Expo/RN Kotlin 2.1 toolchain.
      - dependency-name: react-native-google-mobile-ads
        versions:
          - 16.4.0
      # Storybook majors require coordinated core, addon, and config migration.
      - dependency-name: storybook
        update-types:
          - version-update:semver-major
      - dependency-name: "@storybook/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@chromatic-com/storybook"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
