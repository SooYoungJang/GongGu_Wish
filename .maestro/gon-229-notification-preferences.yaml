appId: com.gonggu.wish.preview
---
# GON-229 Android: verify notification controls and the per-item reminder picker.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "상품을 검색해보세요"
    timeout: 60000
- tapOn:
    text: "마이 탭"
- extendedWaitUntil:
    visible:
      text: "마이페이지"
    timeout: 30000
- tapOn:
    text: "설정 열기"
- extendedWaitUntil:
    visible:
      text: "알림 설정"
    timeout: 30000
- assertVisible:
    id: "push-notification-toggle"
- assertNotVisible:
    id: "deadline-notification-toggle"
- assertVisible:
    id: "submission-approval-notification-toggle"
- assertNotVisible:
    id: "test-notification-button"
- takeScreenshot: gon229-android-01-settings-defaults

# Guests are routed to authentication before any preference can change.
- tapOn:
    id: "submission-approval-notification-toggle"
- extendedWaitUntil:
    visible:
      text: "공구위시 로그인 화면"
    timeout: 30000
- takeScreenshot: gon229-android-02-login-required
- tapOn:
    id: "fl-input-email"
- inputText: "gon229.e2e@example.com"
- tapOn:
    id: "fl-input-password"
- inputText: "Gon229E2E2026!"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "submission-approval-notification-toggle"
    timeout: 30000

# Authenticated preferences remain independently controllable.
- tapOn:
    id: "submission-approval-notification-toggle"
- takeScreenshot: gon229-android-03-custom-preferences
- tapOn:
    id: "submission-approval-notification-toggle"
- tapOn:
    id: "push-notification-toggle"
- extendedWaitUntil:
    visible:
      text: "앱과 기기에서 푸시 알림을 받을 수 있어요.*"
    timeout: 10000
- tapOn:
    id: "push-notification-toggle"
- extendedWaitUntil:
    visible:
      text: "앱에서 푸시 수신을 중지했어요.*"
    timeout: 10000
- tapOn:
    id: "push-notification-toggle"
- extendedWaitUntil:
    visible:
      text: "앱과 기기에서 푸시 알림을 받을 수 있어요.*"
    timeout: 10000

# Reminder dates are selected from an individual deal, not from Settings.
- back
- tapOn:
    text: "홈 탭"
- extendedWaitUntil:
    visible:
      id: "group-buy-reminder-button-gon263-e2e-beauty"
    timeout: 30000
- tapOn:
    id: "group-buy-reminder-button-gon263-e2e-beauty"
- assertVisible:
    text: "공구 마감 알림"
- assertVisible:
    id: "group-buy-reminder-day-7"
- assertVisible:
    id: "group-buy-reminder-day-6"
- assertVisible:
    id: "group-buy-reminder-day-5"
- assertVisible:
    id: "group-buy-reminder-day-4"
- assertVisible:
    id: "group-buy-reminder-day-3"
- assertVisible:
    id: "group-buy-reminder-day-2"
- assertVisible:
    id: "group-buy-reminder-day-1"
- tapOn:
    id: "group-buy-reminder-day-3"
- tapOn:
    id: "group-buy-reminder-day-1"
- takeScreenshot: gon229-android-04-item-reminder-picker
- tapOn:
    id: "group-buy-reminder-save"
- assertNotVisible:
    text: "공구 마감 알림"
