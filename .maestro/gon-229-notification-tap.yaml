appId: com.gonggu.wish.preview
---
# The runner has opened the same deep link carried by a notification payload.
- extendedWaitUntil:
    visible:
      id: "detail-back-button"
    timeout: 30000
- assertVisible:
    text: "GON-263 기준 공구"
- takeScreenshot: gon229-android-05-notification-deep-link

# Follow targets and schedule the selected deadline reminder from Detail.
- assertVisible:
    id: "follow-influencer-notifications"
- assertVisible:
    id: "follow-brand-notifications"
- tapOn:
    id: "follow-influencer-notifications"
- tapOn:
    id: "follow-brand-notifications"
- tapOn:
    id: "detail-notification-toggle"
- extendedWaitUntil:
    visible:
      text: "공구 마감 알림"
    timeout: 15000
- tapOn:
    id: "group-buy-reminder-day-1"
- tapOn:
    id: "group-buy-reminder-save"
- assertNotVisible:
    text: "공구 마감 알림"
- takeScreenshot: gon229-android-06-follows-and-deadline

# Relaunch through the normal launcher intent. The deep link must not replay,
# and the Android-local preferences must still be present.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "상품을 검색해보세요"
    timeout: 60000
- tapOn:
    text: "마이 탭"
- extendedWaitUntil:
    visible:
      text: "마이페이지"
    timeout: 30000
- tapOn:
    text: "설정 열기"
- extendedWaitUntil:
    visible:
      text: "팔로우 알림"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "@gon263_price 인플루언서 알림 해제"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    text: "@gon263_price 인플루언서 알림 해제"
- assertVisible:
    text: "GON-263 Brand 브랜드 알림 해제"
- takeScreenshot: gon229-android-07-persisted-preferences
